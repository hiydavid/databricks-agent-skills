# Local dev convenience only (uv venv + ruff). Databricks Apps installs requirements.txt.
[project]
name = "mcp-genie-space-history-spike"
version = "0.0.1"
description = "P0 de-risking spike for the Genie Space History MCP server"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.118.0",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "fastmcp>=2.12.5",
    "mcp[cli]>=1.14.0",
    "pydantic>=2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["I", "F401", "E722"]
