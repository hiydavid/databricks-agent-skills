# Databricks Apps manifest for the Genie Agent Versioning MCP.
command:
  - "python"
  - "-m"
  - "server.main"

# Save calls read the live Agent as the user, then persist through OBO SQL.
user_api_scopes:
  - sql
  - genie

env:
  - name: HISTORY_CATALOG
    value: "<pre-existing-catalog>"
  - name: HISTORY_SCHEMA
    value: "genie_agent_versioning"
  - name: HISTORY_GRANTEE
    value: "<account-group>"
  # Set true only after a catalog owner has granted USE CATALOG to HISTORY_GRANTEE.
  - name: HISTORY_GRANTEE_USE_CATALOG_CONFIRMED
    value: "false"
  - name: SQL_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  - name: MAX_CONFIG_BYTES
    value: "5242880"
  # Leave ownership with the app SP so bootstrap remains rerunnable. Operators can
  # opt into a one-time group handoff after deciding who will manage schema changes.
  - name: TRANSFER_OWNERSHIP
    value: "false"
  - name: HISTORY_OWNER_GROUP
    value: ""
