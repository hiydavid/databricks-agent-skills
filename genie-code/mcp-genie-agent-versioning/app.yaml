# Databricks Apps manifest for the v2 Genie Agent Versioning MCP.
command:
  - "python"
  - "-m"
  - "server.main"

# User tool calls need only SQL. The app never calls the Genie API.
user_api_scopes:
  - sql

env:
  - name: HISTORY_CATALOG
    value: "<pre-existing-catalog>"
  - name: HISTORY_SCHEMA
    value: "genie_agent_versioning"
  - name: HISTORY_GRANTEE
    value: "<account-group>"
  # Set true only after a catalog owner has granted USE CATALOG to HISTORY_GRANTEE.
  - name: HISTORY_GRANTEE_USE_CATALOG_CONFIRMED
    value: "false"
  - name: SQL_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  - name: CORS_ALLOW_ORIGINS
    value: "https://<workspace-host>"
  - name: OBO_ENABLED
    value: "true"
  - name: MAX_CONFIG_BYTES
    value: "5242880"
  # Leave ownership with the app SP for a test deployment so bootstrap remains
  # rerunnable. Production operators can opt into a one-time group handoff.
  - name: TRANSFER_OWNERSHIP
    value: "false"
  - name: HISTORY_OWNER_GROUP
    value: ""
